services:
  mysql:
    image: mysql:8.4
    container_name: sena-crm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sena_crm
      TZ: UTC
    command: --default-time-zone=+00:00
    ports:
      - "3306:3306"
    volumes:
      - sena-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sena-mysql-data:
